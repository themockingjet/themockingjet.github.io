name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build

      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      # The runner image already ships Chrome's system libraries, so skip apt.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - name: Lighthouse summary
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
        run: |
          {
            echo "### 🔦 Lighthouse"
            echo "| Performance | Accessibility | Best practices | SEO |"
            echo "|---|---|---|---|"
            echo "$MANIFEST" | jq -r '.[] | select(.isRepresentativeRun) | .summary
              | [.performance, .accessibility, ."best-practices", .seo]
              | map(. * 100 | round | tostring) | "| " + join(" | ") + " |"'
          } >> "$GITHUB_STEP_SUMMARY"

  # Single required status check for the branch rulesets.
  checks:
    if: always()
    needs: [verify, e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."

  deploy:
    needs: checks
    # Lighthouse is skipped on pushes, so gate on the checks result directly.
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Summary
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### 🚀 Live at $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed commit \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
